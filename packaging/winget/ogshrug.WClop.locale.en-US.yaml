ShortDescription: Automatic image, video, PDF and audio optimiser.
Description: |-
  WClop quietly makes images, videos, PDFs and audio smaller as you copy, drop and save them: copied screenshots are
  swapped for optimised versions on the clipboard, files dropped on the edge of the screen are optimised, and new
  screenshots and screen recordings are optimised as they're saved. Originals are always backed up. Includes an
  Explorer menu, batch mode, pipelines and the wclop command. A Windows take on Clop for macOS.
